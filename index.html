<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Get Your Free Surprise Samples Box!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #ffffff 0%, #eef2f3 100%);
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Prevents scrolling */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Confetti Canvas */
        #confetti {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .landing-container {
            background: #ffffff;
            width: 90%;
            max-width: 450px;
            padding: 2.5rem 1.5rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            text-align: center;
            z-index: 10;
            opacity: 0;
            transform: translateY(30px);
            animation: slideUpFade 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .scarcity-badge {
            display: inline-block;
            background: #ffe5e5;
            color: #d63031;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
            animation: blink 2s infinite;
        }

        h1 {
            font-size: 2rem;
            color: #2d3436;
            line-height: 1.2;
            margin-bottom: 0.5rem;
            font-weight: 800;
        }

        h1 span {
            color: #d63031; /* Red from the original offer image */
        }

        p.subtitle {
            color: #636e72;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        /* SVG Gift Box with Float Animation */
        .gift-box-container {
            margin: 1.5rem 0 2.5rem 0;
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.2));
            animation: float 3.5s ease-in-out infinite;
        }

        .gift-svg {
            width: 140px;
            height: auto;
        }

        /* High-Converting CTA Button */
        .cta-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #fbc531, #e1b12c); /* Gold/Yellow button */
            color: #2d3436;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: 800;
            padding: 1.2rem 1rem;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(225, 177, 44, 0.4);
            transition: all 0.3s ease;
            animation: pulse 1.5s infinite;
        }

        .cta-btn:active {
            transform: scale(0.95);
            box-shadow: 0 5px 10px rgba(225, 177, 44, 0.4);
        }

        .secure-text {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            margin-top: 1rem;
            font-size: 0.75rem;
            color: #b2bec3;
        }

        /* Animations */
        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 10px 20px rgba(225, 177, 44, 0.4); }
            50% { transform: scale(1.04); box-shadow: 0 15px 30px rgba(225, 177, 44, 0.6); }
            100% { transform: scale(1); box-shadow: 0 10px 20px rgba(225, 177, 44, 0.4); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Media Queries for smaller phones */
        @media (max-height: 700px) {
            h1 { font-size: 1.7rem; }
            .gift-box-container { margin: 1rem 0 1.5rem 0; }
            .gift-svg { width: 110px; }
            .cta-btn { font-size: 1.1rem; padding: 1rem; }
            .landing-container { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <canvas id="confetti"></canvas>

    <div class="landing-container">
        <div class="scarcity-badge">🔥 High Demand: Only 14 Boxes Left!</div>
        
        <h1>FREE <span>SURPRISE SAMPLES BOX</span></h1>
        <p class="subtitle">Available Now!</p>

        <div class="gift-box-container">
            <!-- Custom Teal & Gold Gift Box SVG matching the original design -->
            <svg class="gift-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Shadow -->
                <ellipse cx="50" cy="92" rx="35" ry="6" fill="rgba(0,0,0,0.1)"/>
                <!-- Box Base -->
                <path d="M20,40 L80,40 L75,85 L25,85 Z" fill="#3A8A96"/>
                <path d="M20,40 L50,45 L80,40 L75,85 L50,90 L25,85 Z" fill="#2E707A"/>
                <path d="M50,45 L80,40 L75,85 L50,90 Z" fill="#255E68"/>
                <!-- Vertical Ribbon -->
                <polygon points="45,44 55,44 53,89 47,89" fill="#F1C40F"/>
                <!-- Lid Base -->
                <polygon points="15,25 85,25 88,40 12,40" fill="#429EAD"/>
                <polygon points="12,40 88,40 88,43 12,43" fill="#2E707A"/>
                <!-- Horizontal Ribbon on Lid -->
                <polygon points="43,25 57,25 58,43 42,43" fill="#F1C40F"/>
                <polygon points="13,32 87,32 87,36 13,36" fill="#F39C12"/>
                <!-- Bow -->
                <path d="M50,25 C40,10 25,15 35,25 Z" fill="#F1C40F"/>
                <path d="M50,25 C60,10 75,15 65,25 Z" fill="#F1C40F"/>
                <circle cx="50" cy="25" r="5" fill="#E67E22"/>
            </svg>
        </div>

        <!-- The Affiliate Link from the image -->
        <a href="https://www.af9m8trk.com/QLJ11S9T/XSE11VGQ/" class="cta-btn">
            Claim Your Box Now
        </a>

        <div class="secure-text">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            100% Secure & Direct Link
        </div>
    </div>

    <!-- Lightweight Confetti Animation Script -->
    <script>
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        const colors = ['#d63031', '#fbc531', '#0984e3', '#00b894', '#fd79a8'];

        function createConfetti() {
            for (let i = 0; i < 70; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    w: Math.random() * 10 + 5,
                    h: Math.random() * 10 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speed: Math.random() * 3 + 2,
                    angle: Math.random() * 360,
                    spin: Math.random() * 0.2 - 0.1
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.y += p.speed;
                p.angle += p.spin;
                
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                ctx.restore();

                if (p.y > canvas.height) {
                    particles.splice(index, 1);
                }
            });
            if(particles.length > 0) {
                requestAnimationFrame(draw);
            }
        }

        window.onload = () => {
            createConfetti();
            draw();
        };

        window.onresize = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        };
    </script>
</body>
</html>
