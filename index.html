<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Claim Your Free Sample Box</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #f4f4f4;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .main-card {
            background: #fff;
            width: 95%;
            max-width: 420px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            padding: 20px;
            border-top: 6px solid #e74c3c;
        }

        .alert-bar {
            background: #fff3cd;
            color: #856404;
            padding: 8px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #ffeeba;
            animation: pulse-bg 2s infinite;
        }

        h1 {
            font-size: 24px;
            color: #222;
            font-weight: 900;
            margin-bottom: 5px;
            line-height: 1.2;
        }

        h1 span {
            color: #e74c3c;
        }

        .subtitle {
            font-size: 15px;
            color: #555;
            margin-bottom: 20px;
            font-weight: 500;
        }

        /* SVG Gift Box */
        .gift-svg {
            width: 120px;
            height: auto;
            margin: 0 auto 20px;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.15));
            animation: float 3s ease-in-out infinite;
        }

        /* Form Area */
        .input-group {
            margin-bottom: 15px;
        }

        .input-label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #333;
        }

        input[type="tel"] {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-weight: 700;
            letter-spacing: 2px;
            transition: border-color 0.3s;
        }

        input[type="tel"]:focus {
            border-color: #3498db;
            box-shadow: 0 0 8px rgba(52, 152, 219, 0.3);
        }

        .cta-btn {
            width: 100%;
            background: #27ae60;
            color: white;
            font-size: 20px;
            font-weight: 900;
            padding: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 0 #1e8449;
            transition: all 0.1s;
            animation: button-pulse 1.5s infinite;
        }

        .cta-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #1e8449;
        }

        /* Processing Screen Area */
        #step2 {
            display: none;
            padding: 20px 0;
        }

        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .processing-text {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .check-list {
            text-align: left;
            width: 80%;
            margin: 0 auto;
            font-size: 14px;
            color: #555;
            font-weight: 700;
        }

        .check-item {
            margin-bottom: 8px;
            opacity: 0;
        }

        .check-item.active {
            opacity: 1;
            color: #27ae60;
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes pulse-bg {
            0%, 100% { background: #fff3cd; }
            50% { background: #ffe8a1; }
        }
        @keyframes button-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .footer-text {
            font-size: 11px;
            color: #999;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <!-- STEP 1: The Hook & Zip Input -->
        <div id="step1">
            <div class="alert-bar">⚠️ Only 14 boxes left in your area today!</div>
            
            <h1>FREE <span>SURPRISE BOX</span></h1>
            <p class="subtitle">Complete the quick check to claim yours.</p>

            <svg class="gift-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="50" cy="92" rx="35" ry="6" fill="rgba(0,0,0,0.1)"/>
                <path d="M20,40 L80,40 L75,85 L25,85 Z" fill="#3A8A96"/>
                <path d="M20,40 L50,45 L80,40 L75,85 L50,90 L25,85 Z" fill="#2E707A"/>
                <path d="M50,45 L80,40 L75,85 L50,90 Z" fill="#255E68"/>
                <polygon points="45,44 55,44 53,89 47,89" fill="#F1C40F"/>
                <polygon points="15,25 85,25 88,40 12,40" fill="#429EAD"/>
                <polygon points="12,40 88,40 88,43 12,43" fill="#2E707A"/>
                <polygon points="43,25 57,25 58,43 42,43" fill="#F1C40F"/>
                <polygon points="13,32 87,32 87,36 13,36" fill="#F39C12"/>
                <path d="M50,25 C40,10 25,15 35,25 Z" fill="#F1C40F"/>
                <path d="M50,25 C60,10 75,15 65,25 Z" fill="#F1C40F"/>
                <circle cx="50" cy="25" r="5" fill="#E67E22"/>
            </svg>

            <div class="input-group">
                <label class="input-label">Enter Zip Code to Check Eligibility:</label>
                <!-- Using type="tel" forces the numeric keypad on mobile -->
                <input type="tel" id="zipInput" placeholder="e.g. 90210" maxlength="5" autocomplete="postal-code">
            </div>

            <button class="cta-btn" onclick="startCheck()">CHECK AVAILABILITY</button>
            
            <p class="footer-text">Limit 1 per household. US Residents only.</p>
        </div>

        <!-- STEP 2: The Fake Processing/Verification Screen -->
        <div id="step2">
            <div class="spinner"></div>
            <div class="processing-text" id="statusHeader">Checking Inventory...</div>
            
            <div class="check-list">
                <div class="check-item" id="chk1">✔️ Validating Location...</div>
                <div class="check-item" id="chk2">✔️ Checking Stock...</div>
                <div class="check-item" id="chk3">✔️ Box Reserved!</div>
            </div>
        </div>
    </div>

    <script>
        // Only allow numbers in the input field
        document.getElementById('zipInput').addEventListener('input', function (e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        function startCheck() {
            const zip = document.getElementById('zipInput').value;
            
            // Validate it has exactly 5 digits (Standard US Zip)
            if(zip.length < 5) {
                alert("Please enter a valid 5-digit Zip Code.");
                return;
            }

            // Hide Step 1, Show Step 2
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';

            // Simulate the processing logic for psychological buy-in
            setTimeout(() => { 
                document.getElementById('chk1').classList.add('active'); 
            }, 800);

            setTimeout(() => { 
                document.getElementById('chk2').classList.add('active'); 
            }, 1800);

            setTimeout(() => { 
                document.getElementById('chk3').classList.add('active'); 
                document.getElementById('statusHeader').innerText = "SUCCESS! Redirecting...";
                document.getElementById('statusHeader').style.color = "#27ae60";
                document.querySelector('.spinner').style.borderColor = "#27ae60";
                document.querySelector('.spinner').style.borderTopColor = "#2ecc71";
            }, 2800);

            // Redirect to the affiliate link
            setTimeout(() => { 
                window.location.href = "https://www.af9m8trk.com/QLJ11S9T/XSE11VGQ/"; 
            }, 4000);
        }
    </script>
</body>
</html>
